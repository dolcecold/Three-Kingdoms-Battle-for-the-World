const KEY='tianxia.decklab.light.v1';
const defaults={season:'S2',tab:'meta',profile:'general',metaFilter:'all',inventoryMode:'hero',inventoryFilter:'전체',ownedHeroes:['마초','주태','원소','조조','순욱','사마의','감부인','조운','초선'],ownedTactics:['요새 함락','연전연승','난공불락','허점 공략','청낭 치료','음과 양','허실 간파','청천벽력']};
let state=load();
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderCount()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg='자동 저장됨'){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1100)}
function initials(n){return n.slice(0,2)}
function heroInfo(n){return DEMO.heroes.find(x=>x.name===n)||{name:n,faction:'',role:''}}
function renderNav(){document.querySelectorAll('.season').forEach(b=>b.classList.toggle('on',b.dataset.season===state.season));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+state.tab));}
function renderCount(){document.getElementById('ownedCount').textContent=state.ownedHeroes.length+'명'}
function heroBoxes(team){return `<div class="team">${team.map(n=>{const h=heroInfo(n);return `<div class="hero"><div class="avatar">${esc(initials(n))}</div><b>${esc(n)}</b><small>${esc(h.faction)} · ${esc(h.role)}</small></div>`}).join('')}</div>`}
function metaCard(d){const owned=d.team.filter(n=>state.ownedHeroes.includes(n)).length;return `<article class="card" data-search="${esc([d.name,...d.team,d.skills,d.laws,d.formation].join(' '))}"><div class="deckHead"><div><div class="deckName">${esc(d.name)}</div><div class="badges"><span class="badge gold">${esc(d.cat)}</span>${d.tags.map((x,i)=>`<span class="badge ${i?'green':'blue'}">${esc(x)}</span>`).join('')}</div></div><span class="badge ${owned===3?'green':'gold'}">보유 ${owned}/3</span></div>${heroBoxes(d.team)}<div class="rows"><div class="row"><strong>주요 전법</strong><span>${esc(d.skills)}</span></div><div class="row"><strong>병법</strong><span>${esc(d.laws)}</span></div><div class="row"><strong>진형</strong><span>${esc(d.formation)}</span></div><div class="row"><strong>병종</strong><span>${esc(d.troop)}</span></div><div class="row"><strong>장비</strong><span>${esc(d.gear)}</span></div><div class="row"><strong>말</strong><span>${esc(d.horse)}</span></div></div><div class="actions"><button class="btn" onclick="goCounter()">상성 보기</button><button class="btn primary" onclick="useTeam(${JSON.stringify(d.team).replace(/"/g,'&quot;')})">이 덱 선택</button></div></article>`}
function renderMeta(){document.querySelectorAll('#metaFilters .chip').forEach(b=>b.classList.toggle('on',b.dataset.filter===state.metaFilter));let data=DEMO.meta[state.season]||[];if(state.metaFilter!=='all')data=data.filter(d=>d.cat===state.metaFilter);const q=document.getElementById('search').value.trim().toLowerCase();if(q)data=data.filter(d=>[d.name,...d.team,d.skills,d.laws,d.formation].join(' ').toLowerCase().includes(q));document.getElementById('metaGrid').innerHTML=data.length?data.map(metaCard).join(''):`<div class="empty" style="grid-column:1/-1"><b>조건에 맞는 추천 덱이 없어요.</b>필터나 검색어를 바꿔보세요.</div>`}
function profileLabel(p){return {general:'균형',physrush:'빠른 공격',tactstatus:'책략·상태',multichase:'추격',sustain:'버티기'}[p]||p}
function algoCard(d,i){const owned=d.team.filter(n=>state.ownedHeroes.includes(n)).length;const pct=Math.max(1,Math.round((100-d.score)*.7+3));return `<article class="card algoCard"><div class="algoTop"><div><div class="deckName">${d.team.join(' · ')}</div><div class="badges"><span class="badge blue">${profileLabel(state.profile)}</span><span class="badge green">보유 ${owned}/3</span></div></div><span class="rank">추천 ${i+1}위</span></div>${heroBoxes(d.team)}<div class="summaryRow"><div class="score">${d.score}</div><div><h3>상위 약 ${pct}%</h3><p>${esc(d.formation)} · ${esc(d.reasons[0])}</p></div></div><div class="detailGrid">${d.team.map(n=>`<div class="mini"><b>${esc(n)}</b><small>전법 · ${(d.builds[n]||[]).map(esc).join(' / ')}</small><small>병법 · 역할 맞춤 추천</small><small>장비·말 · 특성 기반 추천</small></div>`).join('')}</div><div class="reason">${d.reasons.map(esc).join(' · ')}</div><div class="actions"><button class="btn" onclick="goCounter()">상성 보기</button><button class="btn primary" onclick="useTeam(${JSON.stringify(d.team).replace(/"/g,'&quot;')})">이 덱 선택</button></div></article>`}
function renderIndependent(){document.querySelectorAll('.profile').forEach(b=>b.classList.toggle('on',b.dataset.profile===state.profile));let data=(DEMO.independent[state.season]||[]).filter(d=>d.team.every(n=>!state.ownedHeroes.length||state.ownedHeroes.includes(n)));if(!data.length){document.getElementById('indGrid').innerHTML=`<div class="empty" style="grid-column:1/-1"><b>현재 보유 장수로 3인 조합을 만들 수 없어요.</b>보유 설정에서 장수를 더 선택해 주세요.</div>`;return}document.getElementById('indGrid').innerHTML=data.map(algoCard).join('')}
function outcome(i,j){if(i===j)return['neutral','—'];const v=(i*7+j*11+state.season.charCodeAt(1))%5;return v<2?['fav','유리']:v<4?['even','비슷']:['bad','불리']}
function renderCounter(){const a=DEMO.counter[state.season]||[];let html='<thead><tr><th>상대 덱 ↓ / 내 덱 →</th>'+a.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';a.forEach((r,i)=>{html+=`<tr><td><b>${esc(r)}</b></td>`;a.forEach((c,j)=>{const [cl,tx]=outcome(i,j);html+=`<td class="${cl}">${tx}</td>`});html+='</tr>'});html+='</tbody>';document.getElementById('matrix').innerHTML=html}
function renderInventoryFilters(){const vals=state.inventoryMode==='hero'?['전체','위','촉','오','군']:['전체','병기','책략','보조'];document.getElementById('invFilters').innerHTML=vals.map(x=>`<button class="filter ${state.inventoryFilter===x?'on':''}" data-invfilter="${x}">${x}</button>`).join('')}
function renderInventory(){renderInventoryFilters();const isHero=state.inventoryMode==='hero',list=isHero?DEMO.heroes:DEMO.tactics,selected=isHero?state.ownedHeroes:state.ownedTactics;let arr=list;if(state.inventoryFilter!=='전체')arr=arr.filter(x=>(isHero?x.faction:x.type)===state.inventoryFilter);document.getElementById('inventory').innerHTML=arr.map(x=>`<button class="pick ${selected.includes(x.name)?'on':''}" data-pick="${esc(x.name)}"><b>${esc(x.name)}</b><small>${esc(isHero?`${x.faction} · ${x.role}`:x.type)}</small></button>`).join('')}
function fullRender(){renderNav();renderCount();renderMeta();renderIndependent();renderCounter();renderInventory()}
function openOwned(){document.getElementById('drawerShade').classList.add('on');renderInventory()}
function closeOwned(){document.getElementById('drawerShade').classList.remove('on')}
function goCounter(){state.tab='counter';save();fullRender();window.scrollTo({top:0,behavior:'smooth'})}
function useTeam(team){state.ownedHeroes=[...new Set([...state.ownedHeroes,...team])];save();fullRender();toast('장수를 보유 목록에 추가했어요')}
window.goCounter=goCounter;window.useTeam=useTeam;

document.addEventListener('click',e=>{
 const s=e.target.closest('.season');if(s){state.season=s.dataset.season;save();fullRender();return}
 const t=e.target.closest('.tab');if(t){state.tab=t.dataset.tab;save();fullRender();return}
 const mf=e.target.closest('[data-filter]');if(mf){state.metaFilter=mf.dataset.filter;save();renderMeta();return}
 const pr=e.target.closest('.profile');if(pr){state.profile=pr.dataset.profile;save();renderIndependent();return}
 const it=e.target.closest('.invTab');if(it){state.inventoryMode=it.dataset.mode;state.inventoryFilter='전체';save();document.querySelectorAll('.invTab').forEach(x=>x.classList.toggle('on',x===it));renderInventory();return}
 const fl=e.target.closest('[data-invfilter]');if(fl){state.inventoryFilter=fl.dataset.invfilter;save();renderInventory();return}
 const pk=e.target.closest('[data-pick]');if(pk){const n=pk.dataset.pick,k=state.inventoryMode==='hero'?'ownedHeroes':'ownedTactics',a=new Set(state[k]);a.has(n)?a.delete(n):a.add(n);state[k]=[...a];save();renderInventory();renderIndependent();renderMeta();return}
});
document.getElementById('search').addEventListener('input',renderMeta);
document.getElementById('openOwned').onclick=openOwned;document.getElementById('openOwned2').onclick=openOwned;document.getElementById('closeOwned').onclick=closeOwned;document.getElementById('doneOwned').onclick=()=>{closeOwned();toast('보유 카드가 저장됐어요')};
document.getElementById('drawerShade').addEventListener('click',e=>{if(e.target.id==='drawerShade')closeOwned()});
document.getElementById('clearOwned').onclick=()=>{if(state.inventoryMode==='hero')state.ownedHeroes=[];else state.ownedTactics=[];save();renderInventory();renderIndependent();renderMeta();toast('선택을 모두 해제했어요')};
fullRender();
</script>
</body>
</html>
